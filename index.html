<!DOCTYPE html>
<html class="dark" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: setto-capture:; connect-src 'self' https://api.bitbucket.org https://api.openai.com https://api.anthropic.com" />
    <title>Setto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Mono stacks used by File Editor / Smart Diff settings (FONT_FAMILIES) -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      /* Pantalla de apertura: se ve antes de que cargue React; main.tsx la desvanece. */
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background:
          radial-gradient(55% 45% at 30% 20%, rgba(196, 167, 255, 0.55), transparent 70%),
          radial-gradient(45% 40% at 80% 85%, rgba(244, 171, 214, 0.45), transparent 70%),
          radial-gradient(40% 35% at 85% 15%, rgba(182, 196, 255, 0.45), transparent 70%),
          #F4F4F5;
        color: #1C1C1E;
        transition: opacity 420ms cubic-bezier(0.25, 0.1, 0.25, 1);
        -webkit-app-region: drag;
        font-family: 'Inter Variable', Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }
      html.dark #splash {
        background:
          radial-gradient(55% 45% at 30% 20%, rgba(124, 58, 237, 0.28), transparent 70%),
          radial-gradient(45% 40% at 80% 85%, rgba(192, 132, 252, 0.16), transparent 70%),
          #18181B;
        color: #F4F4F5;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img {
        width: 168px; height: 168px; border-radius: 38px;
        box-shadow: 0 24px 60px -12px rgba(124, 58, 237, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.04);
        animation: splash-in 700ms cubic-bezier(0.34, 1.2, 0.64, 1) both;
      }
      #splash .name {
        color: inherit; font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
        animation: splash-fade 600ms 180ms ease both;
      }
      #splash .tag {
        color: inherit; opacity: 0.55; font-size: 13px; font-weight: 600; margin-top: -14px;
        animation: splash-fade 600ms 280ms ease both;
      }
      #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(127,127,127,0.18); overflow: hidden; animation: splash-fade 600ms 380ms ease both; }
      #splash .bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 3px;
        background: linear-gradient(90deg, #C9A7FF, #A855F7, #7C3AED);
        animation: splash-load 1.1s ease-in-out infinite;
      }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.86) translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes splash-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <script>
      try {
        var m = localStorage.getItem('app-theme-mode'), t = localStorage.getItem('app-theme')
        var dark = m === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
    <div id="splash" aria-hidden="true">
      <img src="./setto-logo-lg.png" alt="" draggable="false" />
      <div class="name">Setto</div>
      <div class="tag">Notas · Scripts · Gastos</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
